<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiFlow - Legal VA & Attorney Automation Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617'
                        },
                        gold: {
                            500: '#d4af37',
                            600: '#b89728',
                            700: '#997d1e'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(212, 175, 55, 0.25); }

        .legal-project-card{background:#0f172a;border:1px solid rgba(212,175,55,.22);border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.24);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;cursor:pointer}
        .legal-project-card:hover{transform:translateY(-5px);border-color:rgba(212,175,55,.7);box-shadow:0 18px 38px rgba(212,175,55,.12)}
        .legal-project-thumb{height:190px;background:#020617;overflow:hidden}
        .legal-project-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .3s ease}
        .legal-project-card:hover img{transform:scale(1.04)}
        .legal-project-body{padding:16px}
        .legal-project-cat{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#d4af37;font-weight:800}
        .legal-project-body h3{margin-top:5px;color:#fff;font-weight:800;font-size:1rem}
        .legal-project-body p{margin-top:6px;color:#94a3b8;font-size:.8rem;line-height:1.5}
        .legal-project-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
        .legal-project-actions button,.legal-project-actions a{border:1px solid #475569;border-radius:9px;padding:8px 11px;font-size:.72rem;font-weight:700;color:#e2e8f0;background:#1e293b;text-decoration:none;cursor:pointer}
        .legal-project-actions button:hover,.legal-project-actions a:hover{border-color:#d4af37;color:#d4af37}
        .project-preview-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(2,6,23,.88);padding:18px;align-items:center;justify-content:center}
        .project-preview-window{width:min(1400px,100%);height:min(92vh,900px);background:#0f172a;border:1px solid rgba(212,175,55,.4);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55)}
        .project-preview-bar{min-height:56px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155}
        .project-preview-bar strong{color:#fff}
        .project-preview-bar button{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:8px;padding:7px 11px;cursor:pointer}
        .project-preview-frame{width:100%;flex:1;border:0;background:#fff}
        .project-preview-info{padding:12px 16px;border-top:1px solid #334155;color:#cbd5e1;font-size:.78rem}
    </style>
</head>
<body class="bg-navy-950 text-slate-100 h-full flex flex-col antialiased selection:bg-gold-500 selection:text-navy-950">

    <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

    <script>
        const APP_STATE = {
            currentUser: null,
            users: [
                { username: 'va joy,n.', pin: '666666', role: 'Legal VA', name: 'VA Joy N.' },
                { username: 'employer', pin: '666666', role: 'Employer', name: 'Employer (Managing Attorney)' }
            ],
            intakes: JSON.parse(localStorage.getItem('lexiflow_intakes')) || [
                { id: 1, clientName: 'Victoria Sterling', caseType: 'Corporate Litigation', date: '2026-09-18', status: 'Retainer Generated', summary: 'Commercial breach of contract dispute regarding software licensing agreement.' },
                { id: 2, clientName: 'Marcus Vance', caseType: 'Intellectual Property', date: '2026-09-19', status: 'Intake Processed', summary: 'Trademark opposition and brand defense filing.' }
            ],
            deadlines: JSON.parse(localStorage.getItem('lexiflow_deadlines')) || [
                { id: 1, title: 'Motion to Compel Response', case: 'Sterling v. Nexus Corp', date: '2026-10-05', priority: 'High', status: 'Pending' },
                { id: 2, title: 'Appellate Brief Filing', case: 'Vance Trademark Appeal', date: '2026-10-14', priority: 'Medium', status: 'In Progress' }
            ],
            timeLogs: JSON.parse(localStorage.getItem('lexiflow_timelogs')) || [
                { id: 1, user: 'VA Joy N.', task: 'Drafted Interrogatories & Document Production - Sterling Case', hours: 3.5, date: '2026-09-19', billable: true },
                { id: 2, user: 'Employer', task: 'Client Deposition Strategy Conference', hours: 1.5, date: '2026-09-19', billable: true }
            ],
            documents: JSON.parse(localStorage.getItem('lexiflow_documents')) || [
                { id: 1, title: 'Standard Legal Retainer Agreement.docx', category: 'Templates', uploadedBy: 'VA Joy N.', date: '2026-09-01' },
                { id: 2, title: 'Deposition Notice Form_v2.pdf', category: 'Court Forms', uploadedBy: 'Employer', date: '2026-09-05' }
            ],
            auditLogs: JSON.parse(localStorage.getItem('lexiflow_audit')) || [
                { time: '08:30 AM', action: 'Secure legal automation suite initialized.', user: 'System' },
                { time: '09:15 AM', action: 'Automated retainer packet generated for Victoria Sterling.', user: 'VA Joy N.' }
            ]
        };

        function saveState() {
            localStorage.setItem('lexiflow_intakes', JSON.stringify(APP_STATE.intakes));
            localStorage.setItem('lexiflow_deadlines', JSON.stringify(APP_STATE.deadlines));
            localStorage.setItem('lexiflow_timelogs', JSON.stringify(APP_STATE.timeLogs));
            localStorage.setItem('lexiflow_documents', JSON.stringify(APP_STATE.documents));
            localStorage.setItem('lexiflow_audit', JSON.stringify(APP_STATE.auditLogs));
        }

        function logAction(actionText, userName) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            APP_STATE.auditLogs.unshift({ time: timeStr, action: actionText, user: userName });
            if (APP_STATE.auditLogs.length > 25) APP_STATE.auditLogs.pop();
            saveState();
        }

        function render() {
            const app = document.getElementById('app');
            if (!APP_STATE.currentUser) {
                app.innerHTML = renderLandingPage();
            } else {
                app.innerHTML = renderDashboard();
            }
            attachEventHandlers();
        }

        function renderLandingPage() {
            return `
                <header class="border-b border-slate-800 bg-navy-900/90 sticky top-0 z-50 backdrop-blur-md">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-lg bg-gold-500 flex items-center justify-center text-navy-950 font-bold text-xl shadow-lg shadow-gold-500/20">
                                <i class="fa-solid fa-scale-balanced"></i>
                            </div>
                            <div>
                                <span class="font-serif text-2xl font-bold tracking-wide text-white">LexiFlow</span>
                                <span class="block text-xs text-gold-500 font-medium tracking-widest uppercase">Legal VA & Attorney Automation Hub</span>
                            </div>
                        </div>
                        <div>
                            <a href="#login-section" class="bg-gold-500 hover:bg-gold-600 text-navy-950 font-semibold px-5 py-2.5 rounded-lg transition duration-200 shadow-md shadow-gold-500/10 text-sm">
                                <i class="fa-solid fa-lock mr-2"></i>Secure Portal Login
                            </a>
                        </div>
                    </div>
                </header>

                <main class="flex-1">
                    <section class="relative overflow-hidden py-20 lg:py-28 bg-gradient-to-b from-navy-900 via-navy-950 to-navy-950">
                        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d4af37_1px,transparent_1px)] [background-size:16px_16px]"></div>
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                                <div class="lg:col-span-7 space-y-6">
                                    <span class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-gold-500/10 border border-gold-500/30 text-gold-400 text-xs font-semibold uppercase tracking-wider">
                                        <i class="fa-solid fa-shield-halved mr-1"></i> Exclusive 2-User Practice Automation
                                    </span>
                                    <h1 class="font-serif text-4xl sm:text-5xl lg:text-6xl font-bold text-white tracking-tight leading-tight">
                                        Advanced Legal Automation for <span class="text-gold-400">VA Joy N. & Employer</span>
                                    </h1>
                                    <p class="text-slate-300 text-lg sm:text-xl font-light leading-relaxed">
                                        Welcome to the centralized legal operations hub. This application is engineered exclusively for our Legal VA (VA Joy N.) and Managing Employer to automate client intake questionnaires, generate immediate retainer agreements, track court deadlines, and manage secure legal documents.
                                    </p>
                                    <div class="flex flex-wrap gap-4 pt-2">
                                        <a href="#login-section" class="bg-gold-500 hover:bg-gold-600 text-navy-950 font-semibold px-8 py-3.5 rounded-xl transition shadow-lg shadow-gold-500/20 flex items-center">
                                            <span>Access Secure Dashboard</span>
                                            <i class="fa-solid fa-arrow-right ml-2"></i>
                                        </a>
                                        <a href="#what-it-does" class="border border-slate-700 hover:border-gold-500 text-slate-300 hover:text-white px-6 py-3.5 rounded-xl transition flex items-center">
                                            <span>View System Capabilities</span>
                                        </a>
                                    </div>
                                </div>

                                <div id="login-section" class="lg:col-span-5">
                                    <div class="glass-card p-8 rounded-2xl shadow-2xl relative border border-gold-500/30">
                                        <div class="absolute -top-3 left-8 bg-gold-500 text-navy-950 text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full">
                                            Authorized Access Only
                                        </div>
                                        <div class="text-center mb-6 pt-2">
                                            <h3 class="font-serif text-2xl font-bold text-white">System Portal Login</h3>
                                            <p class="text-xs text-slate-400 mt-1">Strictly restricted to VA Joy N. & Employer</p>
                                        </div>
                                        
                                        <form id="login-form" class="space-y-4">
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Select User Profile</label>
                                                <select id="login-username" class="w-full bg-navy-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500 transition">
                                                    <option value="va joy,n.">VA Joy N. (Legal VA)</option>
                                                    <option value="employer">Employer (Managing Attorney)</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Access PIN Password</label>
                                                <input type="password" id="login-pin" placeholder="Enter secure access PIN" class="w-full bg-navy-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-500 transition" required>
                                            </div>
                                            <div id="login-error" class="hidden text-red-400 text-xs bg-red-950/40 p-2.5 rounded-lg border border-red-800/50"></div>
                                            <button type="submit" class="w-full bg-gradient-to-r from-gold-500 to-gold-600 hover:from-gold-600 hover:to-gold-700 text-navy-950 font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-[0.99]">
                                                Secure Login <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
                                            </button>
                                        </form>

                                        <div class="mt-6 pt-6 border-t border-slate-800/80 text-center">
                                            <p class="text-xs text-slate-400">
                                                <i class="fa-solid fa-lock text-gold-500 mr-1"></i> End-to-End Encrypted 2-User Environment
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="what-it-does" class="py-24 bg-navy-900/50 border-t border-b border-slate-800">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="text-center max-w-3xl mx-auto mb-16">
                                <span class="text-gold-400 text-xs font-bold uppercase tracking-widest">Core Automation Features</span>
                                <h2 class="font-serif text-3xl sm:text-4xl font-bold text-white mt-2">What This Legal Automation Suite Does</h2>
                                <p class="text-slate-400 mt-3">Designed specifically to eliminate administrative friction, automate client onboarding, protect court deadlines, and secure sensitive firm documents.</p>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                                <div class="bg-navy-900 border border-slate-800 hover:border-gold-500/50 p-6 rounded-2xl transition group">
                                    <div class="w-12 h-12 rounded-xl bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-400 text-xl mb-4 group-hover:bg-gold-500 group-hover:text-navy-950 transition">
                                        <i class="fa-solid fa-file-invoice"></i>
                                    </div>
                                    <h3 class="font-bold text-lg text-white mb-2">Client Intake & Retainers</h3>
                                    <p class="text-slate-400 text-sm leading-relaxed">Instantly processes prospective client questionnaires, organizes case facts, and auto-generates customized retainer agreements and document packets.</p>
                                </div>

                                <div class="bg-navy-900 border border-slate-800 hover:border-gold-500/50 p-6 rounded-2xl transition group">
                                    <div class="w-12 h-12 rounded-xl bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-400 text-xl mb-4 group-hover:bg-gold-500 group-hover:text-navy-950 transition">
                                        <i class="fa-solid fa-calendar-days"></i>
                                    </div>
                                    <h3 class="font-bold text-lg text-white mb-2">Court Deadline Docketing</h3>
                                    <p class="text-slate-400 text-sm leading-relaxed">Tracks court dates, motion responses, and filing requirements with automated priority levels, countdowns, and completion statuses.</p>
                                </div>

                                <div class="bg-navy-900 border border-slate-800 hover:border-gold-500/50 p-6 rounded-2xl transition group">
                                    <div class="w-12 h-12 rounded-xl bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-400 text-xl mb-4 group-hover:bg-gold-500 group-hover:text-navy-950 transition">
                                        <i class="fa-solid fa-clock-rotate-left"></i>
                                    </div>
                                    <h3 class="font-bold text-lg text-white mb-2">Billable Hour Tracking</h3>
                                    <p class="text-slate-400 text-sm leading-relaxed">Allows VA Joy N. and the Employer to log task durations, track billable entries, and calculate total practice revenue in real-time.</p>
                                </div>

                                <div class="bg-navy-900 border border-slate-800 hover:border-gold-500/50 p-6 rounded-2xl transition group">
                                    <div class="w-12 h-12 rounded-xl bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-400 text-xl mb-4 group-hover:bg-gold-500 group-hover:text-navy-950 transition">
                                        <i class="fa-solid fa-folder-shield"></i>
                                    </div>
                                    <h3 class="font-bold text-lg text-white mb-2">Secure Document Vault</h3>
                                    <p class="text-slate-400 text-sm leading-relaxed">Centralized repository for confidential practice forms, legal templates, and executed client contracts with secure access control.</p>
                                </div>
                            </div>
                        </div>
                    </section>
                
                    <section id="projects-deployments" class="py-24 bg-navy-950 border-t border-slate-800">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div class="text-center max-w-3xl mx-auto mb-12">
                                <span class="text-gold-400 text-xs font-bold uppercase tracking-widest">Projects & Deployments</span>
                                <h2 class="font-serif text-3xl sm:text-4xl font-bold text-white mt-2">Recent Works & Live Deployments</h2>
                                <p class="text-slate-400 mt-3">The same project browsing experience used in the VA CODES portfolio: project-specific thumbnails, project details, live previews, and direct deployment access.</p>
                            </div>
                            <div id="legalProjectGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                        </div>
                    </section>
</main>

                <footer class="bg-navy-900 border-t border-slate-800 py-8 text-center text-xs text-slate-500">
                    <p>LexiFlow Legal Automation Suite &copy; 2026. Built exclusively for VA Joy N. & Employer.</p>
                </footer>
            `;
        }

        let activeTab = 'intake';

        function renderDashboard() {
            const user = APP_STATE.currentUser;
            return `
                <header class="bg-navy-900 border-b border-slate-800 sticky top-0 z-50">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                        <div class="flex items-center space-x-4">
                            <div class="w-10 h-10 rounded-lg bg-gold-500 flex items-center justify-center text-navy-950 font-bold text-xl shadow-lg shadow-gold-500/20">
                                <i class="fa-solid fa-scale-balanced"></i>
                            </div>
                            <div>
                                <div class="flex items-center space-x-2">
                                    <span class="font-serif text-xl font-bold text-white">LexiFlow</span>
                                    <span class="px-2.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-gold-500/20 text-gold-400 border border-gold-500/30">
                                        ${user.role}
                                    </span>
                                </div>
                                <span class="text-xs text-slate-400">Active User: <strong class="text-slate-200">${user.name}</strong></span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <button id="logout-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white px-4 py-2 rounded-lg text-xs font-semibold transition border border-slate-700">
                                <i class="fa-solid fa-right-from-bracket mr-1.5"></i> Logout
                            </button>
                        </div>
                    </div>
                </header>

                <div class="bg-navy-900/60 border-b border-slate-800">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-2 overflow-x-auto">
                        <button onclick="switchTab('intake')" class="px-5 py-3.5 text-sm font-medium border-b-2 transition whitespace-nowrap flex items-center space-x-2 ${activeTab === 'intake' ? 'border-gold-500 text-gold-400 bg-gold-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                            <i class="fa-solid fa-file-invoice"></i><span>Client Intake & Retainers</span>
                        </button>
                        <button onclick="switchTab('deadlines')" class="px-5 py-3.5 text-sm font-medium border-b-2 transition whitespace-nowrap flex items-center space-x-2 ${activeTab === 'deadlines' ? 'border-gold-500 text-gold-400 bg-gold-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                            <i class="fa-solid fa-calendar-days"></i><span>Court Deadline Docket</span>
                        </button>
                        <button onclick="switchTab('billing')" class="px-5 py-3.5 text-sm font-medium border-b-2 transition whitespace-nowrap flex items-center space-x-2 ${activeTab === 'billing' ? 'border-gold-500 text-gold-400 bg-gold-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                            <i class="fa-solid fa-clock-rotate-left"></i><span>Billable Hours Tracking</span>
                        </button>
                        <button onclick="switchTab('documents')" class="px-5 py-3.5 text-sm font-medium border-b-2 transition whitespace-nowrap flex items-center space-x-2 ${activeTab === 'documents' ? 'border-gold-500 text-gold-400 bg-gold-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                            <i class="fa-solid fa-folder-shield"></i><span>Secure Document Vault</span>
                        </button>
                        <button onclick="switchTab('audit')" class="px-5 py-3.5 text-sm font-medium border-b-2 transition whitespace-nowrap flex items-center space-x-2 ${activeTab === 'audit' ? 'border-gold-500 text-gold-400 bg-gold-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'}">
                            <i class="fa-solid fa-shield-halved"></i><span>Activity & Audit Trail</span>
                        </button>
                    </div>
                </div>

                <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
                    ${activeTab === 'intake' ? renderIntakeTab() : ''}
                    ${activeTab === 'deadlines' ? renderDeadlinesTab() : ''}
                    ${activeTab === 'billing' ? renderBillingTab() : ''}
                    ${activeTab === 'documents' ? renderDocumentsTab() : ''}
                    ${activeTab === 'audit' ? renderAuditTab() : ''}
                </main>
            `;
        }

        function renderIntakeTab() {
            return `
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div class="lg:col-span-5 bg-navy-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="font-serif text-lg font-bold text-white flex items-center">
                                <i class="fa-solid fa-user-plus text-gold-500 mr-2"></i> New Client Intake Automation
                            </h3>
                        </div>
                        <form id="intake-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Client Full Name</label>
                                <input type="text" id="intake-name" placeholder="e.g. Richard Henderson" class="w-full bg-navy-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gold-500" required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Practice Area / Case Type</label>
                                <select id="intake-type" class="w-full bg-navy-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gold-500">
                                    <option value="Corporate Litigation">Corporate Litigation</option>
                                    <option value="Intellectual Property">Intellectual Property</option>
                                    <option value="Employment & Labor">Employment & Labor</option>
                                    <option value="Real Estate & Property">Real Estate & Property</option>
                                    <option value="Family Law & Estate">Family Law & Estate</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Case Facts / Summary</label>
                                <textarea id="intake-summary" rows="3" placeholder="Brief facts of dispute, breach, or matter..." class="w-full bg-navy-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gold-500" required></textarea>
                            </div>
                            <button type="submit" class="w-full bg-gold-500 hover:bg-gold-600 text-navy-950 font-bold py-3 rounded-xl shadow-md transition text-sm flex items-center justify-center">
                                <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Auto-Generate Retainer & Packet
                            </button>
                        </form>
                    </div>

        function attachEventHandlers() {
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('login-username').value;
                    const pin = document.getElementById('login-pin').value;
                    const errorBox = document.getElementById('login-error');

                    const foundUser = APP_STATE.users.find(u => u.username === username && u.pin === pin);
                    if (foundUser) {
                        APP_STATE.currentUser = foundUser;
                        logAction(`User signed in: ${foundUser.name}`, foundUser.name);
                        render();
                    } else {
                        errorBox.textContent = "Invalid PIN. Please enter the correct access password.";
                        errorBox.classList.remove('hidden');
                    }
                });
            }

            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    logAction(`User logged out: ${APP_STATE.currentUser.name}`, APP_STATE.currentUser.name);
                    APP_STATE.currentUser = null;
                    render();
                });
            }

            const intakeForm = document.getElementById('intake-form');
            if (intakeForm) {
                intakeForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('intake-name').value;
                    const type = document.getElementById('intake-type').value;
                    const summary = document.getElementById('intake-summary').value;

                    const newRecord = {
                        id: Date.now(),
                        clientName: name,
                        caseType: type,
                        date: new Date().toISOString().split('T')[0],
                        status: 'Retainer Generated',
                        summary: summary
                    };

                    APP_STATE.intakes.unshift(newRecord);
                    logAction(`Auto-generated retainer and packet for client: ${name}`, APP_STATE.currentUser.name);
                    saveState();
                    render();
                });
            }

            const deadlineForm = document.getElementById('deadline-form');
            if (deadlineForm) {
                deadlineForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = document.getElementById('dl-title').value;
                    const caseRef = document.getElementById('dl-case').value;
                    const date = document.getElementById('dl-date').value;
                    const priority = document.getElementById('dl-priority').value;

                    const newDl = {
                        id: Date.now(),
                        title: title,
                        case: caseRef,
                        date: date,
                        priority: priority,
                        status: 'Pending'
                    };

                    APP_STATE.deadlines.unshift(newDl);
                    logAction(`Added court deadline: ${title} (${caseRef})`, APP_STATE.currentUser.name);
                    saveState();
                    render();
                });
            }

            const billingForm = document.getElementById('billing-form');
            if (billingForm) {
                billingForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const task = document.getElementById('bill-task').value;
                    const hours = parseFloat(document.getElementById('bill-hours').value);

                    const newLog = {
                        id: Date.now(),
                        user: APP_STATE.currentUser.name,
                        task: task,
                        hours: hours,
                        date: new Date().toISOString().split('T')[0],
                        billable: true
                    };

                    APP_STATE.timeLogs.unshift(newLog);
                    logAction(`Logged billable hours (${hours} hrs): ${task}`, APP_STATE.currentUser.name);
                    saveState();
                    render();
                });
            }

            const documentForm = document.getElementById('document-form');
            if (documentForm) {
                documentForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = document.getElementById('doc-title').value;
                    const category = document.getElementById('doc-category').value;

                    const newDoc = {
                        id: Date.now(),
                        title: title,
                        category: category,
                        uploadedBy: APP_STATE.currentUser.name,
                        date: new Date().toISOString().split('T')[0]
                    };

                    APP_STATE.documents.unshift(newDoc);
                    logAction(`Uploaded secure document: ${title}`, APP_STATE.currentUser.name);
                    saveState();
                    render();
                });
            }
        }

        function downloadRetainerPacket(id) {
            const item = APP_STATE.intakes.find(i => i.id === id);
            if (item) {
                const packetContent = `==================================================
LEXIFLOW LEGAL AUTOMATION SUITE
AUTOMATED RETAINER & CASE PACKET
==================================================
Client Name: ${item.clientName}
Practice Area: ${item.caseType}
Date Processed: ${item.date}
Status: ${item.status}

CASE SUMMARY & FACTS:
${item.summary}

--------------------------------------------------
STANDARD RETAINER AGREEMENT (AUTO-GENERATED)
--------------------------------------------------
1. Representation: The firm agrees to represent Client in connection with ${item.caseType}.
2. Professional Fees: Billed at standard hourly rates or flat fee agreed upon by VA Joy N. & Employer.
3. Confidentiality: All client data is encrypted and securely managed within the LexiFlow Vault.

Authorized by LexiFlow Automation Engine.
==================================================`;
                
                const blob = new Blob([packetContent], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${item.clientName.replace(/\s+/g, '_')}_Retainer_Packet.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                logAction(`Downloaded retainer packet for ${item.clientName}`, APP_STATE.currentUser.name);
            }
        }

            APP_STATE.intakes = APP_STATE.intakes.filter(i => i.id !== id);

            render();
        }

                logAction(`Updated deadline status for "${item.title}" to ${item.status}`, APP_STATE.currentUser.name);
                saveState();

        function downloadDocument(id) {
            const doc = APP_STATE.documents.find(d => d.id === id);
            if (doc) {
                const content = `CONFIDENTIAL PRACTICE DOCUMENT\nTitle: ${doc.title}\nCategory: ${doc.category}\nUploaded By: ${doc.uploadedBy}\nDate: ${doc.date}\n\n[Encrypted Secure Storage File Content]`;
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = doc.title;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                logAction(`Downloaded document: ${doc.title}`, APP_STATE.currentUser.name);
            }
        }

        function deleteDocument(id) {
            APP_STATE.documents = APP_STATE.documents.filter(d => d.id !== id);
            logAction(`Deleted secure document ID #${id}`, APP_STATE.currentUser.name);
            saveState();
            render();
        }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `LexiFlow_Billing_Summary.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            logAction(`Exported billable hours summary report`, APP_STATE.currentUser.name);

        function renderLegalProjects(){
            const grid=document.getElementById('legalProjectGrid');
            if(!grid)return;
            grid.innerHTML=LEGAL_PROJECTS.map((project,index)=>{
                const detail=LEGAL_PROJECT_DETAILS.find(item=>item.name===project.name)||{};
                const category=detail.category||'Project';
                const about=detail.about||'Live project deployment and portfolio work.';
                const slug=project.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
                const thumb='https://raw.githubusercontent.com/unfacedinternational-dev/va-codes-main/main/assets/project-thumbnails/'+slug+'.svg';
                return `<article class="legal-project-card" onclick="openLegalProject(${index})">
                    <div class="legal-project-thumb"><img src="${thumb}" alt="${project.name} project thumbnail" onerror="this.style.display='none'"></div>
                    <div class="legal-project-body">
                        <div class="legal-project-cat">${category}</div>
                        <h3>${project.name}</h3>
                        <p>${about}</p>
                        <div class="legal-project-actions">
                            <button type="button" onclick="event.stopPropagation();openLegalProject(${index})">Preview</button>
                            <button type="button" onclick="event.stopPropagation();showLegalProjectDetails(${index})">Details</button>
                            <a href="${project.site}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Live Site ↗</a>
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

        function openLegalProject(index){
            const project=LEGAL_PROJECTS[index];
            if(!project)return;
            const overlay=document.getElementById('legalProjectPreview');
            const title=document.getElementById('legalProjectPreviewTitle');
            const frame=document.getElementById('legalProjectPreviewFrame');
            const link=document.getElementById('legalProjectPreviewLink');
            title.textContent=project.name+' • Live Preview';
            frame.src=project.site;
            link.href=project.site;
            overlay.style.display='flex';
            document.body.style.overflow='hidden';
        }

        function closeLegalProject(){
            const overlay=document.getElementById('legalProjectPreview');
            const frame=document.getElementById('legalProjectPreviewFrame');
            if(frame)frame.src='about:blank';
            if(overlay)overlay.style.display='none';
            document.body.style.overflow='';
        }

        function showLegalProjectDetails(index){
            const project=LEGAL_PROJECTS[index];
            const detail=LEGAL_PROJECT_DETAILS.find(item=>item.name===project.name);
            if(!detail)return;
            const features=(detail.features||[]).map(x=>'<li>'+x+'</li>').join('');
            const deliverables=(detail.deliverables||[]).map(x=>'<li>'+x+'</li>').join('');
            document.getElementById('legalProjectDetailsTitle').textContent=project.name;
            document.getElementById('legalProjectDetailsBody').innerHTML=
                '<p><strong>About:</strong> '+(detail.about||'')+'</p>'+
                '<p><strong>How it works:</strong> '+(detail.how||'')+'</p>'+
                '<p><strong>Helps with:</strong> '+(detail.helps||'')+'</p>'+
                '<p><strong>Features:</strong></p><ul>'+features+'</ul>'+
                '<p><strong>Deliverables:</strong></p><ul>'+deliverables+'</ul>';
            document.getElementById('legalProjectDetails').style.display='flex';
            document.body.style.overflow='hidden';
        }

        function closeLegalProjectDetails(){
            document.getElementById('legalProjectDetails').style.display='none';
            document.body.style.overflow='';
